.banner .sub{font-family:var(--body);font-style:italic;font-size:15px;color:var(--muted)}

.herocard{position:relative;overflow:visible}
.stamp{position:absolute;top:-22px;right:-12px;width:78px;height:78px;transform:rotate(-12deg);color:var(--ph);opacity:.9;pointer-events:none;mix-blend-mode:multiply}

.meal{background-color:var(--surface);background-image:linear-gradient(to bottom,transparent 58px,var(--redline) 58px,var(--redline) 60px,transparent 60px),repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-position:0 0,0 60px;background-repeat:no-repeat,repeat;padding-top:12px}

.meal .card-hd .rc{font-family:var(--script);font-size:13px;color:var(--accent);white-space:nowrap}
.meal .nm{margin-top:8px}
.meal .small{line-height:2;font-size:15px}
.meal .ing{line-height:2;font-size:15px}

.verse{font-size:21px;line-height:1.45}
.sig{font-family:var(--script);font-size:13px;color:var(--accent);text-align:right;margin-top:2px}

.lovenote .ln-to{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);grid-column:1}
.lovenote .ln-msg{font-family:var(--body);font-size:17px;line-height:1.4;grid-column:1;font-weight:500}
.lovenote .ln-sig{font-family:var(--script);font-size:14px;color:var(--accent);grid-column:1;margin-top:6px}
.lovenote .ln-stamp{grid-column:2;grid-row:1/4;align-self:start;width:54px;height:62px;border:2px dashed var(--accent);display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};

const S={profile:defProfile(),days:{},tab:"today",viewDate:today(),mealFilter:"phase",mealType:"All",mealView:"plan",calMonth:today().slice(0,7),calSel:today(),q:"",open:{},web:[],webState:"",webErr:"",

let DB=null, COL=null, synced=false, SAMPLE=null;
const dirty=new Set(), timers={}, writing={}, pend={};
function day(d){return S.days[d]||(S.days[d]=defDay())}
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify({profile:S.profile,days:S.days}))}catch(e){}}
function save(key){ // key: "profile" or a date
  cacheLocal();
  if(!COL) return;
  dirty.add(key); pend[key]=true;
  clearTimeout(timers[key]);
  timers[key]=setTimeout(()=>flush(key),700);
}
async function flush(key){
  if(writing[key]){timers[key]=setTimeout(()=>flush(key),400);return}
  writing[key]=true; pend[key]=false;
  const id=key==="profile"?"profile":"d"+key;
  const body=key==="profile"?clone(S.profile):Object.assign(clone(day(key)),{date:key});
  try{await COL.doc(id).set(body);setSync("on")}
  catch(e){setSync("err",e&&e.code)}
  finally{writing[key]=false; if(!pend[key]) dirty.delete(key)}
}
function setSync(state,code){
  const el=document.getElementById("sync");
  el.classList.toggle("on",state==="on");
  el.querySelector("span").textContent=state==="on"?"Synced":state==="wait"?"Connecting…":state==="err"?(code==="permission_denied"?"Sync off · saved on phone":"Sync paused · saved on phone"):"Saved on this phone";
}
async function connect(){
  if(!window.claude||!window.claude.use) return;
  setSync("wait");
  try{
    const [db,user,smp]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]);
    SAMPLE=smp||null; if(S.tab==="meals")render();
    const id=user?await user.id():null;
    if(!db||!id){setSync("local");return}
    DB=db; COL=db.collection("data/users/"+id);
    const t=setTimeout(()=>{if(!synced)setSync("err")},10000);
    let first=true;
    COL.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(t);synced=true;setSync("on")}
      let changed=false;
      snap.docs.forEach(d=>{
        const data=clone(d.data()||{}); const k=d.id==="profile"?"profile":d.id.slice(1);
        if(dirty.has(k)) return;
        if(d.id==="profile"){S.profile=Object.assign(defProfile(),data);changed=true}
        else if(d.id[0]==="d"){delete data.date;S.days[k]=Object.assign(defDay(),data);changed=true}
      });
      // first sync on a fresh store: push anything saved on this phone
      if(first&&snap.empty&&(S.profile.lastPeriod||Object.keys(S.days).length)){save("profile");Object.keys(S.days).forEach(save)}
      first=false;
      if(changed){cacheLocal();render()}
    },e=>{clearTimeout(t);setSync("err",e&&e.code)});
  }catch(e){setSync("local")}
}

/* ---------------- cycle math ---------------- */
function phaseOf(dayN,len){const ov=len-14;if(dayN<=ov-4)return"p1";if(dayN<=ov+1)return"m";if(dayN<=ov+5)return"p2";return"n"}
function cycleAt(date){
  const p=S.profile; if(!p.lastPeriod) return null;
  const len=+p.cycleLen||28; const d=diffDays(date,p.lastPeriod);
  const dayN=((d%len)+len)%len+1;
  return {day:dayN,len,phase:phaseOf(dayN,len),bleed:dayN<=(+p.periodLen||5),next:len-dayN+1,estimated:d>=len||d<0};
}
function avgCycle(){const ps=S.profile.periods.slice().sort();const g=[];for(let i=1;i<ps.length;i++){const x=diffDays(ps[i],ps[i-1]);if(x>=20&&x<=45)g.push(x)}return g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length):null}

function ring(c){
  const R=54,C=2*Math.PI*R,len=c.len,ov=len-14;
  const segs=[["p1",1,ov-4],["m",ov-3,ov+1],["p2",ov+2,ov+5],["n",ov+6,len]];
  let arcs=segs.map(([ph,a,b])=>{const s=(a-1)/len,e=b/len;return `<circle r="${R}" cx="66" cy="66" fill="none" stroke="${phColor(ph)}" stroke-width="9" stroke-dasharray="${(e-s)*C-2} ${C}" stroke-dashoffset="${-s*C}" transform="rotate(-90 66 66)" opacity="${ph===c.phase?1:.35}"/>`}).join("");
  const ang=((c.day-.5)/len)*2*Math.PI-Math.PI/2, x=66+R*Math.cos(ang), y=66+R*Math.sin(ang);
  return `<svg class="ring" viewBox="0 0 132 132" role="img" aria-label="Cycle day ${c.day} of ${len}">${arcs}
   <circle cx="${x}" cy="${y}" r="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
   <text x="66" y="62" text-anchor="middle" fill="var(--muted)" font-size="10" font-family="Courier Prime, monospace" letter-spacing="2">DAY</text>
   <text x="66" y="88" text-anchor="middle" fill="var(--ink)" font-size="36" font-family="Abril Fatface, Georgia, serif">${c.day}</text></svg>`;
}

  let cells=["S","M","T","W","T","F","S"].map(x=>`<div class="h">${x}</div>`).join("");
  for(let i=0;i<42;i++){const d=addDays(start,i);if(i===35&&parse(d).getMonth()!==mo-1)break;
    const c=cycleAt(d),evs=eventsOn(d),out=parse(d).getMonth()!==mo-1;
    cells+=`<button class="d ${out?"out":""} ${d===t?"today":""} ${d===sel?"sel":""}" data-a="csel:${d}" style="--c:${c?phColor(c.phase):"transparent"}" aria-label="${fmtDate(d,{weekday:"long",month:"long",day:"numeric"})}${evs.length?", "+evs.length+" plans":""}">
      <span class="bl">${c&&c.bleed?"●":"&nbsp;"}</span><span class="num">${parse(d).getDate()}</span><span class="dots">${evs.slice(0,3).map(e=>`<i style="--k:${catColor(e.cat)}"></i>`).join("")}</span></button>`}
  let h=`<div class="card"><div class="mhead"><button class="icon" data-a="cmon:-1" aria-label="Previous month">‹</button><strong>${first.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</strong><button class="icon" data-a="cmon:1" aria-label="Next month">›</button></div>
    <div class="mcal">${cells}</div>
    <div class="legend">${PH_ORDER.map(k=>`<span><i class="dot" style="background:${phColor(k)}"></i>${PH[k].short}</span>`).join("")}<span><span style="color:var(--p1)">●</span> period</span>${S.calMonth!==t.slice(0,7)||sel!==t?`<button class="ghost small" data-a="ctoday" style="min-height:0;padding:2px 4px">Today</button>`:""}</div></div>`;
  const c=cycleAt(sel),evs=eventsOn(sel);
  h+=`<div class="card"><div class="dayhd"><div><div class="dt">${fmtDate(sel,{weekday:"long",month:"long",day:"numeric"})}</div>${c?`<div class="small" style="color:${phColor(c.phase)};font-family:var(--mono);letter-spacing:.06em">Cycle day ${c.day} · ${PH[c.phase].name}</div>`:""}</div></div>
    ${c?`<div class="tagline small">${c.bleed?PLAN_TIP.bleed:PLAN_TIP[c.phase]}</div>`:""}
    <div>${evs.map(e=>`<div class="ev ${e.done?"done":""}" style="--k:${catColor(e.cat)}"><button class="check ${e.done?"on":""}" style="width:auto;padding:0;min-height:0" data-a="evdone:${e.rec?"r":"o"}:${e.id}" aria-label="Mark done"><span class="box">${e.done?"✓":""}</span></button>
      <div><div class="row" style="gap:8px"><span class="tm">${fmtTime(e.time)}</span><span class="tt">${esc(e.title)}</span></div>${e.note?`<div class="small muted">${esc(e.note)}</div>`:""}<span class="cat">${e.fixed?"Every year":esc(e.cat)+(e.rec?" · weekly":"")}</span></div>
      ${e.fixed?"<span></span>":`<button class="x" data-a="evdel:${e.rec?"r":"o"}:${e.id}" aria-label="Delete">×</button>`}</div>`).join("")||'<div class="empty">Nothing planned yet.</div>'}</div></div>`;
  h+=`<form class="card" data-f="event"><h2>Add to ${sel===t?"today":fmtDate(sel,{month:"short",day:"numeric"})}</h2>
    <label class="f">What's happening?<input id="evTitle" required placeholder="e.g. Dentist, leg day, date night"></label>
    <div class="grid2"><label class="f">Time<input id="evTime" type="time"></label><label class="f">Kind<select id="evCat">${CATS.map(([n])=>`<option>${n}</option>`).join("")}</select></label></div>
    <label class="f">Note<input id="evNote" placeholder="Optional"></label>
    <label class="row small" style="gap:8px;flex-wrap:nowrap"><input id="evRepeat" type="checkbox" style="width:20px;height:20px;flex:none"> Repeat every ${fmtDate(sel,{weekday:"long"})}</label>
    <button class="primary" type="submit">Add to planner</button></form>`;
  const up=[];for(let i=0;i<14;i++){const d=addDays(t,i);eventsOn(d).forEach(e=>{if(!e.done)up.push([d,e])})}
  h+=`<div class="card"><h3>Coming up · next two weeks</h3><div class="list">${up.slice(0,10).map(([d,e])=>`<div class="item"><div><strong>${esc(e.title)}</strong><div class="small muted">${d===t?"Today":fmtDate(d)} · ${fmtTime(e.time)}</div></div><i class="dot" style="background:${catColor(e.cat)};margin-top:8px"></i></div>`).join("")||'<div class="empty">The next two weeks are wide open.</div>'}</div></div>`;
  return h;
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const [a,...r]=el.dataset.a.split(":");const arg=r.join(":");
  const p=S.profile,vd=S.viewDate;
  const D=(d)=>day(d);
  switch(a){
    case"tab":S.tab=arg;if(arg!=="today")S.viewDate=S.viewDate||today();window.scrollTo(0,0);break;
    case"dnav":S.viewDate=addDays(S.viewDate,+arg);if(S.viewDate>today())S.viewDate=today();break;
    case"water":{const dd=D(S.tab==="today"?today():vd),was=dd.water;dd.water=dd.water===+arg?+arg-1:+arg;save(S.tab==="today"?today():vd);if(was<p.waterGoal&&dd.water>=p.waterGoal)love("water");break}
    case"wateradd":{const k=S.tab==="today"?today():vd,dd=D(k),was=dd.water;dd.water=Math.max(0,dd.water+ +arg);save(k);if(was<p.waterGoal&&dd.water>=p.waterGoal)love("water");break}
    case"vit":{const k=S.tab==="today"?today():vd,dd=D(k),n=p.vitamins[+arg];dd.vit[n]=!dd.vit[n];save(k);if(dd.vit[n]&&p.vitamins.every(x=>dd.vit[x]))love("vit");break}
    case"vitdel":p.vitamins.splice(+arg,1);save("profile");break;
    case"sym":{const dd=D(today()),i=dd.sym.indexOf(arg);i<0?dd.sym.push(arg):dd.sym.splice(i,1);save(today());break}
    case"useavg":p.cycleLen=+arg;save("profile");toast("Cycle length set to "+arg);break;
    case"perioddel":p.periods=p.periods.filter(d=>d!==arg);p.lastPeriod=p.periods.slice().sort().pop()||null;save("profile");break;
    case"pickex":S.draft.ex=arg;break;
    case"setadd":{const last=S.draft.sets[S.draft.sets.length-1]||{r:"",w:""};S.draft.sets.push({r:last.r,w:last.w});break}
    case"setdel":S.draft.sets.splice(+arg,1);if(!S.draft.sets.length)S.draft.sets.push({r:"",w:""});break;
    case"liftdel":D(vd).lifts.splice(+arg,1);save(vd);break;
    case"actdel":D(vd).acts.splice(+arg,1);save(vd);break;
    case"fooddel":D(vd).foods.splice(+arg,1);save(vd);break;
    case"mview":S.mealView=arg;window.scrollTo(0,0);break;
    case"mf":S.mealFilter=arg;break;
    case"mt":S.mealType=arg;break;
    case"bdplan":{document.getElementById("bdwrap").hidden=true;const d=nextBday();S.tab="plan";S.calSel=d;S.calMonth=d.slice(0,7);window.scrollTo(0,0);break}
    case"bdclose":document.getElementById("bdwrap").hidden=true;return;
    case"csel":S.calSel=arg;if(arg.slice(0,7)!==S.calMonth)S.calMonth=arg.slice(0,7);break;
    case"cmon":{const [y,m]=S.calMonth.split("-").map(Number),d=new Date(y,m-1+ +arg,1);S.calMonth=iso(d).slice(0,7);break}
    case"ctoday":S.calMonth=today().slice(0,7);S.calSel=today();break;
    case"evdone":{const [kind,id]=arg.split(":"),d=S.calSel===undefined?today():(S.tab==="plan"?S.calSel:today());
      if(kind==="r"){const k=d+"|"+id;p.recDone[k]=!p.recDone[k];if(!p.recDone[k])delete p.recDone[k];save("profile")}
      else{const ev=(day(d).events||[]).find(x=>x.id===id);if(ev){ev.done=!ev.done;save(d);if(ev.done)love("event",0.3)}}break}
    case"evdel":{const [kind,id]=arg.split(":"),d=S.calSel;
      if(kind==="r"){p.recurring=p.recurring.filter(x=>x.id!==id);save("profile")}else{const dd=day(d);dd.events=(dd.events||[]).filter(x=>x.id!==id);save(d)}break}
    case"mopen":S.open[arg]=!S.open[arg];break;
    case"websearch":webSearch();return;
    case"savemeal":{const m=(S.web||[]).find(x=>x.id===arg);if(m&&!p.customMeals.some(x=>x.id===arg)){p.customMeals.push(m);save("profile");toast("Saved to her meals")}break}
    case"unsave":p.customMeals=p.customMeals.filter(x=>x.id!==arg);p.cart=p.cart.filter(x=>x.id!==arg);save("profile");break;
    case"cart":{const i=p.cart.findIndex(c=>c.id===arg);if(i<0){const m=getMeal(arg);if(arg.startsWith("c-")&&!p.customMeals.some(x=>x.id===arg))p.customMeals.push(m);p.cart.push({id:arg,s:m.s});if(!love("plan",0.35))toast("Added to shopping list")}else p.cart.splice(i,1);save("profile");break}
    case"serv":{const [id,dlt]=arg.split(":");const c=p.cart.find(x=>x.id===id);if(c){c.s=Math.max(1,c.s+ +dlt);save("profile")}break}

      else{ta.hidden=false;ta.value=txt;ta.select()}

    case"chap":{const bk=p.bibleBook,n=+arg,arr=p.bible[bk]||(p.bible[bk]=[]),i=arr.indexOf(n),label=(bk==="Psalms"?"Psalm":bk)+" "+n,dd=D(today());
      if(i<0){arr.push(n);arr.sort((x,y)=>x-y);if(!dd.bible.includes(label))dd.bible.push(label);love("bible",dd.bible.length===1?1:0.4)}else{arr.splice(i,1);const j=dd.bible.indexOf(label);if(j>=0)dd.bible.splice(j,1)}
      save("profile");save(today());break}
    default:return;
  }
  render();
});
document.addEventListener("submit",e=>{
  const f=e.target.dataset.f;if(!f)return;e.preventDefault();
  const v=id=>(document.getElementById(id)||{}).value||"";const p=S.profile,vd=S.viewDate;
  switch(f){
    case"setup":{const d=v("setupDate");if(!d)return;p.lastPeriod=d;if(!p.periods.includes(d))p.periods.push(d);p.cycleLen=Math.min(45,Math.max(21,+v("setupLen")||28));save("profile");love("hello");break}
    case"period":{const d=v("periodDate");if(!d)return;if(!p.periods.includes(d))p.periods.push(d);p.lastPeriod=p.periods.slice().sort().pop();save("profile");love("period");break}
    case"vitadd":{const n=v("vitName").trim();if(n&&!p.vitamins.includes(n)){p.vitamins.push(n);save("profile")}break}
    case"bibleQuick":case"bibleAdd":{const n=v(f).trim();if(!n)return;day(today()).bible.push(n);save(today());love("bible");break}
    case"lift":{const dr=S.draft;dr.ex=v("exName").trim();const sets=dr.sets.filter(s=>s.r||s.w);if(!dr.ex||!sets.length){toast("Add the exercise and at least one set");return}
      day(vd).lifts.push({ex:dr.ex,sets:sets.map(s=>({r:s.r,w:s.w}))});save(vd);love("lift");S.draft={ex:"",sets:[{r:"",w:""}]};break}
    case"act":{const m=parseInt(v("actMin"));if(!m)return;day(vd).acts.push({type:v("actType"),min:m,eff:v("actEff"),note:v("actNote").trim()});save(vd);love("act");break}
    case"event":{const title=v("evTitle").trim();if(!title)return;const d=S.calSel,cat=v("evCat"),time=v("evTime"),note=v("evNote").trim(),rep=document.getElementById("evRepeat").checked;
      if(rep){p.recurring.push({id:uid(),title,time,cat,note,dow:parse(d).getDay(),start:d});save("profile")}

  }

});
